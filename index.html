<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Senhas do Mestre 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Gerador de Senhas do Mestre 2026</h1>
    <div class="senha-box">
      <input type="text" id="senha" readonly placeholder="Senha:">
      <button id="copiar">Copiar</button>
    </div>
    <div class="opcao">
      <label>Tamanho: <input type="number" id="tamanho" value="12" min="4" max="32"></label>
    </div>
    <div class="opcao">
      <label>Letras MAIÚSCULAS: <input type="checkbox" id="maiusculas" checked></label>
    </div>
    <div class="opcao">
      <label>Letras minúsculas: <input type="checkbox" id="minusculas" checked></label>
    </div>
    <div class="opcao">
      <label>Núm3r05: <input type="checkbox" id="numeros" checked></label>
    </div>
    <div class="opcao">
      <label>$!mb@l@$: <input type="checkbox" id="simbolos" checked></label>
    </div>
    <button id="gerar">Gerar Senha</button>
    <p class="forca" id="forca"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
